name: Weekly link check

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 07:00 Central
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,204,206,301,302,303,307,308,403,429
            --max-concurrency 8
            --exclude-path node_modules
            --exclude 'myknowledgehub\.vumc\.org'
            --exclude 'ckmproxy\.vumc\.org'
            --exclude 'vimbook\.vumc\.org'
            --exclude 'medsites\.vumc\.org'
            --exclude 'linkedin\.com'
            'content/**/*.md'
          fail: false
      - name: Open or update issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links found by weekly check"
          content-filepath: ./lychee/out.md
          labels: link-rot
